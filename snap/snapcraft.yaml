name: bottom
version: "0.14.9"
summary: Bottom - yet another cross-platform graphical process/system monitor
description: |
  A customizable cross-platform graphical process/system monitor for the terminal.
  Supports Linux, macOS, and Windows, and inspired by gtop, gotop, and htop.

  After installation, run the following commands so the program will run as intended:

  `sudo snap connect bottom:mount-observe`

  `sudo snap connect bottom:hardware-observe`

  `sudo snap connect bottom:system-observe`

  `sudo snap connect bottom:process-control`

  For more info, check out the program repo (https://github.com/ClementTsang/bottom)
  or the documentation (https://bottom.pages.dev/stable/).

license: MIT

base: core24
grade: stable
confinement: strict
compression: lzo
website: https://bottom.pages.dev/stable/
issues: https://github.com/ClementTsang/bottom-snap/issues
source-code: https://github.com/ClementTsang/bottom
contact: https://github.com/ClementTsang/bottom-snap

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
  armhf:
    build-on: [armhf]
    build-for: [armhf]
  ppc64el:
    build-on: [ppc64el]
    build-for: [ppc64el]
  riscv64:
    build-on: [riscv64]
    build-for: [riscv64]
  s390x:
    build-on: [s390x]
    build-for: [s390x]

apps:
  bottom:
    command: bin/btm
    completer: share/bash-completion/completions/bottom
    plugs:
      - mount-observe
      - network-control
      - process-control
      - system-observe
      - hardware-observe
      - network

parts:
  bottom:
    source: https://github.com/ClementTsang/bottom
    source-type: git
    source-tag: 0.14.9
    plugin: rust
    build-environment:
      - BTM_GENERATE: "true"
      - COMPLETION_DIR: $CRAFT_PART_BUILD/completion
      - MANPAGE_DIR: $CRAFT_PART_BUILD/manpage
    override-build: |
      craftctl default

      # clap generates the completion bound to "btm", but the snap exposes the
      # command as "bottom", so register both names.
      mkdir -p "$CRAFT_PART_INSTALL/share/bash-completion/completions"
      sed 's/ btm$/ btm bottom/' "$COMPLETION_DIR/btm.bash" \
        > "$CRAFT_PART_INSTALL/share/bash-completion/completions/bottom"

      install -Dm644 "$MANPAGE_DIR/btm.1" "$CRAFT_PART_INSTALL/share/man/man1/btm.1"
